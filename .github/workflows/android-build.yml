name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""

          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under SDK root: $SDK_ROOT"
            find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Validate stable signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ARMYRIST_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ARMYRIST_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEYSTORE_B64" ] || \
             [ -z "$SIGNING_STORE_PASSWORD" ] || \
             [ -z "$SIGNING_KEY_ALIAS" ] || \
             [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Stable signing secrets are not fully configured."
            exit 1
          fi

          echo "Stable signing secrets are configured."

      - name: Restore stable signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ARMYRIST_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ARMYRIST_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/armyrist-stable-release.jks"

          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "ARMYRIST_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ARMYRIST_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ARMYRIST_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ARMYRIST_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build stable distribution APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify distribution APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"

          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1)"

          if [ -z "$CERT_SHA256" ]; then
            echo "Unable to determine APK signing certificate fingerprint."
            exit 1
          fi

          echo "Distribution certificate SHA-256: $CERT_SHA256"
          printf 'SHA-256=%s\n' "$CERT_SHA256" \
            > "$RUNNER_TEMP/armyrist-signing-certificate.txt"

      - name: Prepare distribution artifact
        shell: bash
        run: |
          set -euo pipefail

          METADATA="app/build/outputs/apk/release/output-metadata.json"
          VERSION_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["versionName"])' "$METADATA")"
          VERSION_CODE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["versionCode"])' "$METADATA")"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          mkdir -p "$RUNNER_TEMP/armyrist-distribution"
          APK_NAME="Armyrist-${VERSION_NAME}-vc${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/armyrist-distribution/$APK_NAME"

          printf 'versionName=%s\nversionCode=%s\n' "$VERSION_NAME" "$VERSION_CODE" \
            > "$RUNNER_TEMP/armyrist-distribution/VERSION.txt"

          echo "Built distribution: $APK_NAME"

      - name: Upload debug/test APK
        uses: actions/upload-artifact@v4
        with:
          name: Armyrist-debug-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload stable distribution APK
        uses: actions/upload-artifact@v4
        with:
          name: Armyrist-stable-distribution
          path: ${{ runner.temp }}/armyrist-distribution/
          if-no-files-found: error

      - name: Upload signing certificate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: Armyrist-signing-certificate
          path: ${{ runner.temp }}/armyrist-signing-certificate.txt
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/armyrist-stable-release.jks"
