name: Android Build

on:
  push:
    branches: [ "main", "release/0.6.74" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply reviewed handicap tool changes
        if: hashFiles('Killomris-0.6.74-source-changes.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, base64
          from pathlib import Path
          patch = Path('Killomris-0.6.74-source-changes.json')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'ba738bf8743683900b73d33a31acf5a0a3bc89ae11aa10c07219cd4b81c7d7b7'
          for entry in json.loads(patch.read_text()):
              name = entry['path']
              target = Path(name)
              assert not target.is_absolute() and '..' not in target.parts
              assert name.startswith(('app/', 'design/')) or name == 'release/release-notes.txt'
              assert target.suffix not in {'.keystore', '.jks', '.p12', '.pem', '.key'}
              target.parent.mkdir(parents=True, exist_ok=True)
              if entry['encoding'] == 'base64':
                  target.write_bytes(base64.b64decode(entry['content'], validate=True))
              else:
                  target.write_text(entry['content'])
          patch.unlink()
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add configurable handicap situation tool [skip ci]'
          git push origin HEAD:refs/heads/release/0.6.74

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""

          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under SDK root: $SDK_ROOT"
            find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-parallel --max-workers=2 test --stacktrace

      - name: Record unit test results
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, json, xml.etree.ElementTree as E
          from pathlib import Path
          files = list(Path('app/build/test-results/testReleaseUnitTest').glob('TEST-*.xml'))
          stats = {key: sum(int(E.parse(f).getroot().get(key, 0)) for f in files) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert stats['tests'] >= 238 and stats['failures'] == stats['errors'] == stats['skipped'] == 0, stats
          Path(os.environ['RUNNER_TEMP'], 'Killomris-test-results.json').write_text(json.dumps(stats))
          print(stats)
          PYTHON

      - name: Build debug APK
        run: ./gradlew --no-parallel --max-workers=2 assembleDebug --stacktrace

      - name: Validate stable signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ARMYRIST_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ARMYRIST_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEYSTORE_B64" ] || \
             [ -z "$SIGNING_STORE_PASSWORD" ] || \
             [ -z "$SIGNING_KEY_ALIAS" ] || \
             [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Stable signing secrets are not fully configured."
            exit 1
          fi

          echo "Stable signing secrets are configured."

      - name: Restore stable signing keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ARMYRIST_SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ARMYRIST_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ARMYRIST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/armyrist-stable-release.jks"

          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "ARMYRIST_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ARMYRIST_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ARMYRIST_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ARMYRIST_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build stable distribution APK
        run: ./gradlew --no-parallel --max-workers=2 assembleRelease --stacktrace

      - name: Verify distribution APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"

          test -f "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1)"

          if [ -z "$CERT_SHA256" ]; then
            echo "Unable to determine APK signing certificate fingerprint."
            exit 1
          fi

          EXPECTED_CERT_SHA256="3559c3c7de4ce49cd45e845d0b7dafa535ac06a35f2826084e8867dc3f4e5d9e"
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signing certificate does not match the previous stable distribution."
            exit 1
          fi

          echo "Distribution certificate SHA-256: $CERT_SHA256"
          printf 'SHA-256=%s\n' "$CERT_SHA256" \
            > "$RUNNER_TEMP/armyrist-signing-certificate.txt"

      - name: Prepare stable release package
        shell: bash
        run: |
          set -euo pipefail

          BUILD_METADATA="app/build/outputs/apk/release/output-metadata.json"
          VERSION_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["versionName"])' "$BUILD_METADATA")"
          VERSION_CODE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elements"][0]["versionCode"])' "$BUILD_METADATA")"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          DIST="$RUNNER_TEMP/armyrist-distribution"
          mkdir -p "$DIST"
          APK_NAME="Armyrist-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$DIST/$APK_NAME"

          python3 scripts/generate_release_metadata.py \
            --apk "$DIST/$APK_NAME" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --notes release/release-notes.txt \
            --output "$DIST/release.json"

          cp release/release-notes.txt "$DIST/RELEASE_NOTES.txt"
          cp "$RUNNER_TEMP/Killomris-test-results.json" "$DIST/Killomris-test-results.json"
          printf 'versionName=%s\nversionCode=%s\ntag=v%s\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$VERSION_NAME" \
            > "$DIST/VERSION.txt"

          echo "Prepared stable release package: $APK_NAME + release.json"

      - name: Upload debug/test APK
        uses: actions/upload-artifact@v4
        with:
          name: Armyrist-debug-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload stable distribution APK
        uses: actions/upload-artifact@v4
        with:
          name: Armyrist-stable-distribution
          path: ${{ runner.temp }}/armyrist-distribution/
          if-no-files-found: error

      - name: Upload signing certificate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: Armyrist-signing-certificate
          path: ${{ runner.temp }}/armyrist-signing-certificate.txt
          if-no-files-found: error

      - name: Prepare draft release for review
        if: github.ref == 'refs/heads/release/0.6.74'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.6.74"
          DIST="$RUNNER_TEMP/armyrist-distribution"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "낄롬리스 0.6.74" \
            --notes-file "$DIST/RELEASE_NOTES.txt" \
            --draft \
            "$DIST/Armyrist-0.6.74.apk" "$DIST/release.json"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/armyrist-stable-release.jks"
